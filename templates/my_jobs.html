<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening e'lonlarim — IshBor-Live.uz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .job-card {
            background: white;
            border-radius: 20px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary fs-4" href="/">
                <i class="fa-solid fa-briefcase me-2"></i>IshBor-Live.uz
            </a>
            <a href="/" class="btn btn-outline-secondary rounded-pill px-3 btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Bosh sahifaga qaytish
            </a>
        </div>
    </nav>

    <div class="container py-5 mt-4">
        <h2 class="fw-bold mb-4"><i class="fa-solid fa-user-tag text-primary me-2"></i>Mening e'lonlarim</h2>

        <div class="row">
            {% for job in jobs %}
            <div class="col-md-6 mb-4">
                <div class="job-card p-4">
                    <h4 class="fw-bold text-dark mb-1">{{ job.title }}</h4>
                    <p class="text-muted small mb-3"><i class="fa-solid fa-building me-1"></i> {{ job.company }} | <i class="fa-solid fa-location-dot me-1"></i> {{ job.region }}</p>
                    <p class="text-secondary small mb-3">{{ job.description[:100] }}...</p>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="/job/{{ job.id }}" class="btn btn-outline-primary rounded-pill px-3 btn-sm">Ko'rish</a>
                        <div>
                            <a href="/edit-job/{{ job.id }}" class="btn btn-sm btn-warning rounded-pill px-3 text-white">Tahrirlash</a>
                            <a href="/delete-job/{{ job.id }}" class="btn btn-sm btn-danger rounded-pill px-3" onclick="return confirm('Haqiqatan ham bu e\'lonni o\'chirmoqchimisiz?');">O'chirish</a>
                        </div>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12 text-center py-5">
                <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                    <i class="fa-solid fa-folder-open text-muted display-4 mb-3"></i>
                    <p class="text-muted fs-5 mb-3">Siz hali hech qanday e'lon bermagansiz.</p>
                    <a href="/add-job" class="btn btn-primary rounded-pill px-4 mx-auto">Birinchi e'lonni berish</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
