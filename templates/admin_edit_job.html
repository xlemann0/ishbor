<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E'lonni Tahrirlash — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card p-4 shadow-sm border rounded-4 bg-white">
            <h3 class="fw-bold text-primary mb-3">E'lonni Tahrirlash (Admin)</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Sarlavha:</label>
                    <input type="text" name="title" class="form-control rounded-3" value="{{ job.title }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Kompaniya / Ism:</label>
                    <input type="text" name="company" class="form-control rounded-3" value="{{ job.company }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Narxi:</label>
                    <input type="text" name="salary" class="form-control rounded-3" value="{{ job.salary }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Hudud:</label>
                    <select name="region" class="form-select rounded-3">
                        {% for reg in regions %}
                            <option value="{{ reg }}" {% if job.region == reg %}selected{% endif %}>{{ reg }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Tavsif:</label>
                    <textarea name="description" class="form-control rounded-3" rows="3" required>{{ job.description }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Saqlash</button>
            </form>
            <div class="text-center mt-3">
                <a href="/admin" class="text-decoration-none small text-secondary">Admin panelga qaytish</a>
            </div>
        </div>
    </div>
</body>
</html>
