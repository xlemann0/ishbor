<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Kirish — IshBor-Live.uz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-shield-halved text-primary display-4 mb-2"></i>
            <h3 class="fw-bold">Admin Kirish</h3>
            <p class="text-muted small">Faqat maxsus ruxsat uchun</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Login:</label>
                <input type="text" name="username" class="form-control rounded-pill px-3" required placeholder="admin">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Parol:</label>
                <input type="password" name="password" class="form-control rounded-pill px-3" required placeholder="******">
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-semibold shadow-sm">Kirish</button>
        </form>
        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none small text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Bosh sahifaga qaytish</a>
        </div>
    </div>

</body>
</html>
