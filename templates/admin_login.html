<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Kirish - IshBor.uz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }</style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white text-center" style="width: 100%; max-width: 400px;">
        <h3 class="fw-bold mb-3">Admin Panel</h3>
        <p class="text-muted small mb-4">Davom etish uchun parolni kiriting</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} rounded-4 py-2 small mb-3">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <input type="password" name="password" class="form-control form-control-lg text-center" placeholder="Parol" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">Kirish</button>
        </form>
        <div class="mt-3">
            <a href="/" class="text-decoration-none small text-muted">&larr; Bosh sahifaga qaytish</a>
        </div>
    </div>
</body>
</html>
