<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Admin Kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 350px;">
        <h3 class="text-center mb-3">Admin Panel</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Parolni kiriting:</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Kirish</button>
        </form>
        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none text-muted">Saytga qaytish</a>
        </div>
    </div>
</body>
</html>
