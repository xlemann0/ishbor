<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E'lon berish — IshBor-Live.uz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-top: 50px; padding-bottom: 50px; }
        .form-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; max-width: 650px; margin: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">Yangi ish o'rni e'lon qilish</h3>
                <p class="text-muted small">Ma'lumotlarni to'liq va aniq kiriting</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Kasb nomi / Sarlavha:</label>
                    <input type="text" name="title" class="form-control rounded-3" required placeholder="Masalan: Python Dasturchi">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small">Kompaniya nomi:</label>
                        <input type="text" name="company" class="form-control rounded-3" required placeholder="Kompaniya MChJ">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small">Maosh (Narxlar):</label>
                        <input type="text" name="salary" class="form-control rounded-3" required placeholder="5 000 000 - 8 000 000 so'm">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small">Hudud:</label>
                        <select name="region" class="form-select rounded-3">
                            {% for reg in regions %}
                                <option value="{{ reg }}">{{ reg }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small">Kategoriya:</label>
                        <select name="category" class="form-select rounded-3">
                            {% for cat in categories %}
                                <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small">Ish turi:</label>
                        <input type="text" name="job_type" class="form-control rounded-3" value="To'liq stavka">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small">Telefon raqam:</label>
                        <input type="text" name="phone" class="form-control rounded-3" required placeholder="+998901234567">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small">Qisqacha tavsif va talablar:</label>
                    <textarea name="description" class="form-control rounded-3" rows="4" required placeholder="Nomzodga qo'yiladigan talablar va vazifalar..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill fw-semibold py-2 shadow-sm">E'lonni joylash</button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none small text-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Bosh sahifaga qaytish</a>
            </div>
        </div>
    </div>
</body>
</html>
