<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish — IshBor-Live.uz</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3067/3067444.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .auth-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; padding: 40px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary mb-1">Tizimga kirish</h3>
            <p class="text-muted small">E'lon berish uchun profilingizga kiring</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} rounded-4 py-2 mb-3 small">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Telefon raqam</label>
                <input type="text" name="phone" class="form-control rounded-pill px-3" placeholder="+998 90 123 45 67" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Parol</label>
                <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="******" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3">Kirish</button>
        </form>

        <div class="text-center">
            <p class="small text-muted mb-0">Profilingiz yo'qmi? <a href="/register" class="text-primary fw-semibold text-decoration-none">Ro'yxatdan o'tish</a></p>
            <a href="/" class="small text-secondary text-decoration-none d-block mt-2"><i class="fa-solid fa-arrow-left me-1"></i> Bosh sahifaga qaytish</a>
        </div>
    </div>
</body>
</html>
