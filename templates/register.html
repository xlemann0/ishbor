<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish - IshBor-Live.uz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }</style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white" style="width: 100%; max-width: 450px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Ro'yxatdan o'tish</h3>
            <p class="text-muted small">E'lon berish uchun profilingizni yarating</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for cat, msg in messages %}
                <div class="alert alert-{{ cat }} rounded-4 py-2 small mb-3">{{ msg }}</div>
            {% endfor %}{% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small">F.I.Sh.</label>
                <input type="text" name="fullname" class="form-control rounded-pill px-3" placeholder="Ism Familiya" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Telefon raqam</label>
                <input type="text" name="phone" class="form-control rounded-pill px-3" placeholder="+998 90 123 45 67" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">Parol</label>
                <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="Parol" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold rounded-pill shadow-sm">Ro'yxatdan o'tish</button>
        </form>
        <div class="text-center mt-3">
            <p class="small text-muted">Profilingiz bormi? <a href="/login" class="text-decoration-none fw-semibold">Kirish</a></p>
            <a href="/" class="text-decoration-none small text-secondary">&larr; Bosh sahifaga qaytish</a>
        </div>
    </div>
</body>
</html>
