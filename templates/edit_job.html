<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E'lonni tahrirlash — IshBor-Live.uz</title>
    
    <!-- Sayt logotipi -->
    <link rel="icon" href="{{ url_for('static', filename='logo.jpg') }}" type="image/jpeg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; padding: 40px 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-box { background: white; border-radius: 20px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; max-width: 600px; margin: auto; }
        .current-img { width: 100px; height: 100px; object-fit: cover; border-radius: 10px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h3 class="fw-bold text-primary text-center mb-3">E'lonni Tahrirlash</h3>

            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">E'lon turi:</label>
                    <select name="ad_type" class="form-select rounded-3" required>
                        {% for t in ad_types %}
                            <option value="{{ t }}" {% if job.ad_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Sarlavha:</label>
                    <input type="text" name="title" value="{{ job.title }}" class="form-control rounded-3" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Kompaniya yoki Ism:</label>
                        <input type="text" name="company" value="{{ job.company }}" class="form-control rounded-3" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Narxi / Maoshi:</label>
                        <input type="text" name="salary" value="{{ job.salary }}" class="form-control rounded-3" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Hudud:</label>
                        <select name="region" class="form-select rounded-3">
                            {% for reg in regions %}
                                <option value="{{ reg }}" {% if job.region == reg %}selected{% endif %}>{{ reg }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Kategoriya:</label>
                        <select name="category" class="form-select rounded-3">
                            {% for cat in categories %}
                                <option value="{{ cat }}" {% if job.category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Telefon raqam:</label>
                    <input type="text" name="phone" value="{{ job.phone }}" class="form-control rounded-3" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Batafsil ma'lumot:</label>
                    <textarea name="description" class="form-control rounded-3" rows="3" required>{{ job.description }}</textarea>
                </div>

                <!-- Mavjud rasm va uni o'chirish / o'zgartirish -->
                <div class="mb-4 p-3 bg-light rounded-3 border">
                    <label class="form-label small fw-semibold text-primary d-block">📷 E'lon rasmi:</label>
                    {% if job.job_img %}
                        <div class="d-flex align-items-center gap-3 mb-2">
                            <img src="{{ url_for('static', filename='uploads/' + job.job_img) }}" class="current-img" alt="Hozirgi rasm">
                            <div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="remove_job_img" value="yes" id="removeImg">
                                    <label class="form-check-label text-danger small fw-semibold" for="removeImg">
                                        Rasmni olib tashlash (o'chirish)
                                    </label>
                                </div>
                            </div>
                        </div>
                    {% else %}
                        <p class="text-muted small mb-2">Hozircha rasm yuklanmagan.</p>
                    {% endif %}
                    
                    <label class="form-label small text-secondary mt-1">Yangi rasm yuklash (eski rasmni almashtiradi):</label>
                    <input type="file" name="job_img" class="form-control rounded-3" accept="image/*">
                </div>

                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">O'zgarishlarni saqlash</button>
            </form>
            <div class="text-center mt-3">
                <a href="/my-ads" class="text-decoration-none small text-secondary">Orqaga qaytish</a>
            </div>
        </div>
    </div>
</body>
</html>
